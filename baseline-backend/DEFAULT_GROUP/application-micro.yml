      - /webjars/**
      - /*/webjars/**
      - /swagger-resources
      - /swagger-resources/**
      - /*/swagger-resources
      - /*/swagger-resources/**
      - /swagger-ui/**
      - /*/swagger-ui/**
      - /*/v2/api-docs
      - /*/v2/api-docs/**
      - /*/v3/api-docs
      - /*/v3/api-docs/**
      # 验证码
      - /auth/captcha/image
      - /auth/captcha/isEnabled
      # 认证服务
