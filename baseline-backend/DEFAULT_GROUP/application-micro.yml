    - "sys_user_real_name_auth"
    - "sys_member_real_name_auth"
    - "sys_member_third_party_bind"
    - "sys_config_group"
    - "sys_config"
    - "sys_dict_data"
    - "sys_dict_type"
    - "sys_menu"
    - "sys_permission"
    - "sys_project"
    - "sys_tenant"
    - "sys_menu"
    - "sys_logininfor"
